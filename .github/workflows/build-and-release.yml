name: Build and Release Rebased Language Packs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      languages:
        description: '指定构建的语言（如 all、zh-CN,ja,ko 等）'
        required: false
        default: 'all'
      version:
        description: '指定下载的官方语言包版本号（留空则自动选用最新版本）'
        required: false
        default: ''
      create_release:
        description: '是否发布为 GitHub Release（仅在手动触发时有效）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Language Packs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Build Script
        id: build
        run: |
          mkdir -p dist
          ARGS=""
          LANGS="${{ github.event.inputs.languages }}"
          if [ -n "$LANGS" ]; then
            ARGS="$ARGS --langs $LANGS"
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            ARGS="$ARGS -v ${{ github.event.inputs.version }}"
          fi

          python build.py $ARGS

          # 验证 dist/ 目录下产物
          COUNT=$(find dist -maxdepth 1 -name "rebased-*-pack-*.zip" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::未在 dist/ 中找到任何生成的插件 ZIP 文件！"
            exit 1
          fi

          echo "共成功构建 $COUNT 个语言包插件！"
          ls -lh dist/

      - name: Upload Build Artifacts (CI Run)
        uses: actions/upload-artifact@v4
        with:
          name: rebased-language-packs
          path: |
            dist/*.zip
            dist/*.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
          name: ${{ github.ref_name }}
          body: |
            ### 适用客户端
            专为 **[Rebased](https://github.com/DetachHead/rebased)**（基于 IntelliJ 平台的纯粹 Git 客户端）定制的官方语言包补丁。

            ### 语言包列表
            - **简体中文 (zh-CN)**: `rebased-zh-CN-pack-*.zip`
            - **日本語 (ja)**: `rebased-ja-pack-*.zip`
            - **한국어 (ko)**: `rebased-ko-pack-*.zip`

            ### 安装指南
            1. 下载下方 Assets 中的对应语言 `.zip` 插件包；
            2. 打开 **Rebased**；
            3. 欢迎首页直接点击 **Plugins**（或在设置中打开 `Plugins`）；
            4. 点击齿轮图标 ⚙️ -> **Install Plugin from Disk...**（从磁盘安装插件）；
            5. 选择下载的 zip 文件并确定；
            6. 点击 **Customize** -> **Language** 切换为对应语言，重启即可生效。
